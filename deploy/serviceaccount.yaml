# Scriven's pods get no Kubernetes API rights in the cluster they run in.
# Every target, this cluster included, is reached through a kubeconfig for a
# read-only identity (Secret scriven-kubeconfigs), so the same rules apply
# everywhere and scriven refuses to start if one of them can write.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: scriven
automountServiceAccountToken: false
