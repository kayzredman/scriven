apiVersion: apps/v1
kind: Deployment
metadata:
  name: scriven-watch
  labels:
    app.kubernetes.io/component: watch
spec:
  replicas: 1 # one watcher: two would record every change twice
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: scriven
      app.kubernetes.io/component: watch
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scriven
        app.kubernetes.io/component: watch
      annotations:
        # /metrics is served on the same port as the audit webhook.
        prometheus.io/scrape: "true"
        prometheus.io/port: "8099"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: scriven
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: scriven
          image: scriven
          # --sweep-first: catch anything that changed while the watcher was down.
          args: [watch, --sweep-first, --config, /etc/scriven/config/scriven.yaml]
          envFrom:
            - secretRef:
                name: scriven-env
          ports:
            - name: audit
              containerPort: 8099
          readinessProbe:
            httpGet: { path: /healthz, port: audit }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: audit }
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 768Mi } # terraform plan runs inside this container
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - { name: config, mountPath: /etc/scriven/config, readOnly: true }
            - { name: kubeconfigs, mountPath: /etc/scriven/kubeconfigs, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: config
          configMap:
            name: scriven-config
        - name: kubeconfigs
          secret:
            secretName: scriven-kubeconfigs
            defaultMode: 0400
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
