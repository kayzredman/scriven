# The nightly safety net: a full, rate-limited re-capture of every target.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: scriven-sweep
  labels:
    app.kubernetes.io/component: sweep
spec:
  schedule: "0 2 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: scriven
            app.kubernetes.io/component: sweep
        spec:
          restartPolicy: Never
          serviceAccountName: scriven
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: scriven
              image: scriven
              args: [sweep, --config, /etc/scriven/config/scriven.yaml]
              envFrom:
                - secretRef:
                    name: scriven-env
              resources:
                requests: { cpu: 50m, memory: 128Mi }
                limits: { memory: 768Mi }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - { name: config, mountPath: /etc/scriven/config, readOnly: true }
                - { name: kubeconfigs, mountPath: /etc/scriven/kubeconfigs, readOnly: true }
                - { name: tmp, mountPath: /tmp }
          volumes:
            - name: config
              configMap:
                name: scriven-config
            - name: kubeconfigs
              secret:
                secretName: scriven-kubeconfigs
                defaultMode: 0400
            - name: tmp
              emptyDir:
                sizeLimit: 1Gi
